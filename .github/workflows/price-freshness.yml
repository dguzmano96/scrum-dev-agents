name: Price table freshness

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check vence
        id: fresh
        continue-on-error: true
        run: ./scripts/price-freshness.sh

      - name: Open an issue when the price table is stale
        if: steps.fresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search 'in:title Price table stale' --json number --jq 'length')"
          if [[ "$existing" != "0" ]]; then
            echo "Open issue already tracks a stale price table."
            exit 0
          fi
          details="$(./scripts/price-freshness.sh || true)"
          {
            echo "The weekly freshness check found the model-policy price table outside its window."
            echo
            echo '```'
            echo "$details"
            echo '```'
            echo
            echo "Refresh before the plugin keeps shipping stale slugs:"
            echo
            echo "1. Open https://cursor.com/docs/models-and-pricing and the Spanish variant of that page."
            echo "2. Follow AGENTS.md section 2.1 and docs/fuentes.md (list prices, cost, bar_drain, cheap cache, gates, dominance, tie-break)."
            echo "3. Update rules/cursor-agent-policy.mdc, AGENTS.md, docs/matriz.md, and docs/fuentes.md together. Set precios_consultados to the fetch date and vence to one calendar month later."
            echo "4. Merge to main. Cursor plugin updates then ship the new matrix. This workflow does not rewrite cells on its own."
          } > /tmp/price-stale-issue.md
          gh issue create --title "Price table stale: refresh model policy" --body-file /tmp/price-stale-issue.md
